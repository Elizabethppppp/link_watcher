openapi: 3.1.0
info:
  title: Link Watcher API
  description: Сервис мониторинга доступности URL.
  version: 1.0.0
servers:
  - url: http://localhost:8090

paths:
  /targets:
    post:
      summary: Добавить ссылку для отслеживания
      operationId: CreateTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTargetRequest'
      responses:
        '201':
          description: Ссылка успешно добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Такая ссылка уже отслеживается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Получить список всех ссылок
      operationId: GetTargets
      responses:
        '200':
          description: Список всех ссылок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Target'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /targets/{id}:
    put:
      summary: Изменить ресурс
      operationId: UpdateTarget
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTargetRequest'
      responses:
        '200':
          description: Ресурс обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ссылка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Новый URL уже отслеживается другой записью
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /targets/{id}/tracking:
    patch:
      summary: Включить или выключить отслеживание
      operationId: UpdateTracking
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrackingRequest'
      responses:
        '200':
          description: Состояние обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ссылка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /targets/{id}/summary:
    get:
      summary: Сводка за сутки по конкретной ссылке
      operationId: GetTargetSummary
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          description: Сводка за последние 24 часа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '404':
          description: Ссылка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /targets/summary:
    get:
      summary: Сводка за сутки по всем ссылкам вместе
      operationId: GetGlobalSummary
      responses:
        '200':
          description: Общая сводка за последние 24 часа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    TargetId:
      name: id
      in: path
      required: true
      description: Идентификатор отслеживаемой ссылки
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

  schemas:
    CreateTargetRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: URL для отслеживания
          example: "https://example.com/page"
        intervalSec:
          type: integer
          format: int32
          minimum: 1
          default: 60
          description: Интервал проверки в секундах

    UpdateTargetRequest:
      type: object
      required: [url, intervalSec]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          example: "https://example.com/page"
        intervalSec:
          type: integer
          format: int32
          minimum: 1
          example: 30

    UpdateTrackingRequest:
      type: object
      required: [isTracking]
      additionalProperties: false
      properties:
        isTracking:
          type: boolean
          description: true - проверять, false - поставить на паузу
          example: false

    Target:
      type: object
      required: [id, url, isTracking, intervalSec, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        url:
          type: string
          format: uri
          example: "https://example.com/page"
        isTracking:
          type: boolean
          example: true
        intervalSec:
          type: integer
          format: int32
          example: 60
        createdAt:
          type: string
          format: date-time
          description: Момент создания
          example: "2026-09-21T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Момент последнего изменения
          example: "2026-09-21T12:30:00Z"

    Summary:
      type: object
      required: [successPct, avgLatencyMs]
      properties:
        successPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Процент успешных проверок за последние 24 часа
          example: 97.5
        avgLatencyMs:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Средняя задержка в миллисекундах по успешным проверкам.
            null, если за сутки не было ни одной успешной проверки
          example: 142.3

    ErrorResponse:
      type: object
      required: [code, internalCode, devMessage, userMessage]
      properties:
        code:
          type: string
          description: Класс ошибки
          enum: [BAD_REQUEST, NOT_FOUND, CONFLICT, INTERNAL]
          example: "BAD_REQUEST"
        internalCode:
          type: string
          description: Описание ошибки
          enum: [INVALID_REQUEST_DATA, URL_ALREADY_EXISTS, TARGET_NOT_FOUND, INTERNAL_ERROR]
          example: "INVALID_REQUEST_DATA"
        devMessage:
          type: string
          description: Сообщение для разработчика
          example: "Internal Server Error"
        userMessage:
          $ref: '#/components/schemas/UserMessage'

    UserMessage:
      type: object
      required: [langEng, langRu]
      properties:
        langEng:
          type: string
          description: Сообщение для пользователя на английском
          example: "Invalid request data"
        langRu:
          type: string
          description: Сообщение для пользователя на русском
          example: "Некорректные данные для запроса"