openapi: 3.1.0
info:
  title: Link Watcher API
  description: Сервис мониторинга доступности URL.
  version: 1.0.0
servers:
  - url: http://localhost:8090

paths:
  /targets:
    post:
      summary: Добавить ссылку для отслеживания
      operationId: CreateTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTargetRequest'
      responses:
        '201':
          description: Ссылка успешно добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Такая ссылка уже отслеживается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /targets/{id}:
    put:
      summary: Изменить ресурс
      operationId: UpdateTarget
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTargetRequest'
      responses:
        '200':
          description: Ссылка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: Некорректный URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ссылка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Новый URL уже отслеживается другой записью
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /targets/{id}/tracking:
    patch:
      summary: Включить или выключить отслеживание
      operationId: UpdateTracking
      parameters:
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrackingRequest'
      responses:
        '200':
          description: Состояние обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ссылка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /targets/{id}/summary:
    get:
      summary: Сводка за сутки по конкретной ссылке
      operationId: GetTargetSummary
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          description: Сводка за последние 24 часа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '404':
          description: Ссылка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /targets/summary:
    get:
      summary: Сводка за сутки по всем ссылкам вместе
      operationId: GetGlobalSummary
      responses:
        '200':
          description: Общая сводка за последние 24 часа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    TargetId:
      name: id
      in: path
      required: true
      description: Идентификатор отслеживаемой ссылки
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

  schemas:
    CreateTargetRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: URL для отслеживания
          example: "https://example.com/page"
        interval_sec:
          type: integer
          format: int32
          minimum: 1
          default: 60
          description: Интервал проверки в секундах

    UpdateTargetRequest:
      type: object
      required: [url, interval_sec]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          example: "https://example.com/page"
        interval_sec:
          type: integer
          format: int32
          minimum: 1
          example: 30

    UpdateTrackingRequest:
      type: object
      required: [is_tracking]
      additionalProperties: false
      properties:
        is_tracking:
          type: boolean
          description: true - проверять, false - поставить на паузу
          example: false

    Target:
      type: object
      required: [id, url, is_tracking, interval_sec, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        url:
          type: string
          format: uri
          example: "https://example.com/page"
        is_tracking:
          type: boolean
          example: true
        interval_sec:
          type: integer
          format: int32
          example: 60
        created_at:
          type: string
          format: date-time
          description: Момент создания
          example: "2026-09-21T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения
          example: "2026-09-21T12:30:00Z"

    Summary:
      type: object
      required: [success_pct, avg_latency_ms]
      properties:
        success_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Процент успешных проверок за последние 24 часа
          example: 97.5
        avg_latency_ms:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Средняя задержка в миллисекундах по успешным проверкам.
            null, если за сутки не было ни одной успешной проверки
          example: 142.3

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Описание ошибки
          example: "url already exists"